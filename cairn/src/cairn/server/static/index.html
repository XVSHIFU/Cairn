<style>
  [x-cloak] { display: none !important; }
  #cy { width: 100%; height: 100%; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  .overlay { background: rgba(15,23,42,0.25); backdrop-filter: blur(6px); }
  .timeline-flash { animation: timelineFlash 1s ease-out; }
  .reason-chip-running { animation: reasonChipGlow 1.8s ease-in-out infinite; }
  .intent-chip-running { animation: intentChipGlow 1.8s ease-in-out infinite; }
  .reason-panel-running::before {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 22px;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.14), rgba(56, 189, 248, 0));
    animation: reasonPanelPulse 2.1s ease-out infinite;
    pointer-events: none;
  }
  .reason-beacon {
    position: relative;
    width: 10px;
    height: 10px;
    border-radius: 9999px;
    background: #0ea5e9;
    box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.16);
  }
  .reason-beacon::after {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 9999px;
    border: 1.5px solid rgba(14, 165, 233, 0.34);
    animation: reasonBeaconPulse 1.8s ease-out infinite;
  }
  .reason-graph-scan {
    position: absolute;
    inset: 8px;
    overflow: hidden;
    pointer-events: none;
    border-radius: 18px;
  }
  .reason-graph-scan::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow:
      inset 0 0 0 1px rgba(125, 211, 252, 0.32),
      inset 0 0 30px rgba(125, 211, 252, 0.06),
      inset 0 0 64px rgba(56, 189, 248, 0.03);
    animation: reasonFramePulse 2.8s ease-in-out infinite;
  }
  .reason-graph-scan::after {
    content: "";
    position: absolute;
    inset: 0;
    inset: 12px;
    border-radius: 12px;
    background:
      linear-gradient(90deg, rgba(125, 211, 252, 0.85), rgba(125, 211, 252, 0.18)),
      linear-gradient(180deg, rgba(125, 211, 252, 0.85), rgba(125, 211, 252, 0.18)),
      linear-gradient(270deg, rgba(125, 211, 252, 0.85), rgba(125, 211, 252, 0.18)),
      linear-gradient(0deg, rgba(125, 211, 252, 0.85), rgba(125, 211, 252, 0.18));
    background-size: 18px 2px, 2px 18px, 18px 2px, 2px 18px;
    background-position: left top, left top, right bottom, right bottom;
    background-repeat: no-repeat;
    opacity: 0.6;
  }
  .reason-graph-scan > span {
    position: absolute;
    inset: 0;
    display: block;
  }
  .reason-graph-grid {
    inset: 12px;
    border-radius: 12px;
    background:
      repeating-linear-gradient(
        90deg,
        rgba(186, 230, 253, 0) 0,
        rgba(186, 230, 253, 0) 35px,
        rgba(186, 230, 253, 0.045) 36px,
        rgba(186, 230, 253, 0.045) 37px
      ),
      repeating-linear-gradient(
        180deg,
        rgba(186, 230, 253, 0) 0,
        rgba(186, 230, 253, 0) 35px,
        rgba(186, 230, 253, 0.04) 36px,
        rgba(186, 230, 253, 0.04) 37px
      );
    opacity: 0.42;
  }
  .reason-graph-ambient {
    inset: 0;
    background:
      radial-gradient(circle at 12% 18%, rgba(56, 189, 248, 0.11), rgba(56, 189, 248, 0) 30%),
      radial-gradient(circle at 84% 16%, rgba(59, 130, 246, 0.08), rgba(59, 130, 246, 0) 24%),
      linear-gradient(180deg, rgba(186, 230, 253, 0.055), rgba(255, 255, 255, 0) 46%);
    animation: reasonAmbientPulse 2.4s ease-in-out infinite alternate;
  }
  .reason-graph-scanline {
    inset: 0;
  }
  .reason-graph-scanline::before {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    height: 2px;
    top: 12%;
    background: linear-gradient(90deg, rgba(56, 189, 248, 0), rgba(186, 230, 253, 0.96), rgba(56, 189, 248, 0));
    box-shadow:
      0 0 18px rgba(125, 211, 252, 0.42),
      0 0 34px rgba(186, 230, 253, 0.16);
    animation: reasonGraphScanline 4.2s linear infinite;
  }
  .reason-graph-sweep {
    inset: -18%;
    background: linear-gradient(
      103deg,
      rgba(14, 165, 233, 0) 40%,
      rgba(56, 189, 248, 0.04) 47%,
      rgba(255, 255, 255, 0.22) 50%,
      rgba(125, 211, 252, 0.1) 53%,
      rgba(14, 165, 233, 0) 60%
    );
    transform: translateX(-86%) skewX(-14deg);
    animation: reasonGraphSweep 4.6s ease-in-out infinite;
  }
  .title-action-trigger {
    min-width: 0;
  }
  .title-action-button {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    transition: opacity 180ms ease, transform 180ms ease, background-color 180ms ease, color 180ms ease, border-color 180ms ease;
  }
  @media (hover: hover) and (pointer: fine) {
    .title-action-button {
      opacity: 0;
      transform: translateY(2px);
      pointer-events: none;
    }
    .title-action-trigger:hover .title-action-button,
    .title-action-trigger:focus-within .title-action-button {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
  }
  @keyframes timelineFlash {
    0% { background: rgba(99, 102, 241, 0.18); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.2); }
    35% { background: rgba(99, 102, 241, 0.12); box-shadow: 0 0 0 8px rgba(99, 102, 241, 0.08); }
    100% { background: rgba(99, 102, 241, 0); box-shadow: 0 0 0 14px rgba(99, 102, 241, 0); }
  }
  @keyframes reasonBeaconPulse {
    0% { transform: scale(0.72); opacity: 0.9; }
    70% { transform: scale(1.45); opacity: 0; }
    100% { transform: scale(1.45); opacity: 0; }
  }
  @keyframes reasonPanelPulse {
    0% { transform: scale(0.96); opacity: 0; }
    18% { opacity: 1; }
    70% { transform: scale(1.02); opacity: 0.18; }
    100% { transform: scale(1.03); opacity: 0; }
  }
  @keyframes reasonChipGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.18); }
    50% { box-shadow: 0 0 0 7px rgba(56, 189, 248, 0.08); }
  }
  @keyframes intentChipGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.18); }
    50% { box-shadow: 0 0 0 7px rgba(251, 191, 36, 0.08); }
  }
  @keyframes reasonGraphSweep {
    0% { transform: translateX(-86%) skewX(-14deg); opacity: 0; }
    18% { opacity: 1; }
    82% { opacity: 1; }
    100% { transform: translateX(88%) skewX(-14deg); opacity: 0; }
  }
  @keyframes reasonAmbientPulse {
    0% { opacity: 0.75; }
    100% { opacity: 1; }
  }
  @keyframes reasonGraphScanline {
    0% { top: 11%; opacity: 0.18; }
    8% { opacity: 0.55; }
    50% { opacity: 0.42; }
    92% { opacity: 0.55; }
    100% { top: 87%; opacity: 0.18; }
  }
  @keyframes reasonFramePulse {
    0%, 100% { opacity: 0.72; }
    50% { opacity: 1; }
  }
</style>

</script>

<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden" :class="{ 'select-none cursor-col-resize': isResizingPanel }" x-data="cairnApp()">

<!-- ═══════════ PROJECT LIST VIEW ═══════════ -->
<div x-show="view === 'list'" x-cloak class="flex-1 flex flex-col overflow-hidden">
  <header class="bg-white/80 backdrop-blur border-b border-slate-200/60 px-4 py-2.5 flex items-center gap-3 shrink-0">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="h-8 w-8 rounded-lg border border-slate-200 bg-white shadow-sm shadow-slate-200/40 flex items-center justify-center shrink-0 overflow-hidden">
        <img src="/static/favicon.svg" alt="" class="w-5 h-5 block">
      </div>
      <span class="font-semibold text-slate-700 tracking-tight">Cairn</span>
    </div>
    <div class="flex-1"></div>
    <div class="flex items-center gap-3 text-[11px] text-slate-400">
      <span class="inline-flex items-center gap-1.5 shrink-0" :title="t('allProjects')">
        <span class="font-medium uppercase tracking-[0.12em] text-slate-400" x-text="t('all')"></span>
        <span class="font-semibold text-slate-600 tabular-nums" x-text="projects.length"></span>
      </span>
      <span class="inline-flex items-center gap-1.5 shrink-0" :title="t('activeProjects')">
        <span class="h-1.5 w-1.5 rounded-full bg-teal-500"></span>
        <span class="font-semibold text-teal-700 tabular-nums" x-text="countProjectsByStatus('active')"></span>
      </span>
      <span class="inline-flex items-center gap-1.5 shrink-0" :title="t('stoppedProjects')">
        <span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>
        <span class="font-semibold text-amber-700 tabular-nums" x-text="countProjectsByStatus('stopped')"></span>
      </span>
      <span class="inline-flex items-center gap-1.5 shrink-0" :title="t('completedProjects')">
        <span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span>
        <span class="font-semibold text-slate-600 tabular-nums" x-text="countProjectsByStatus('completed')"></span>
      </span>
      <button type="button"
        @click="stopAllActiveProjects()"
        :disabled="!hasActiveProjects() || isStoppingAllProjects"
        class="h-7 px-2.5 rounded-lg border border-amber-200 text-xs text-amber-700 hover:bg-amber-50 transition inline-flex items-center gap-1.5 shrink-0 disabled:cursor-not-allowed disabled:opacity-40"
        :title="t('stopAllActive')">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        <span x-text="isStoppingAllProjects ? t('stopping') : t('stopActive')"></span>
      </button>
    </div>
    <div class="flex items-center gap-1.5">
      <button @click="openVulnerability('overview')" class="h-7 px-2.5 rounded-lg border border-sky-200 bg-sky-50/70 text-xs text-sky-700 hover:bg-sky-100/70 transition inline-flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.25c0 4.49 3.2 8.7 7.5 9.75 4.3-1.05 7.5-5.26 7.5-9.75V6L12 3Z"/><path d="m9.5 12 1.75 1.75L15 10"/></svg>
        <span x-text="t('vulnerabilityMining')"></span>
      </button>
      <button @click="showNewProject = true" class="h-7 px-2.5 rounded-lg border border-brand-200 text-xs text-brand-600 hover:bg-brand-50 transition inline-flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        <span x-text="t('newProject')"></span>
      </button>
    </div>
    <div class="flex items-center gap-1.5 ml-1">
      <button @click="showLocalPrefs = true" class="h-7 max-w-40 px-2.5 rounded-lg border border-slate-200 text-xs text-slate-500 hover:bg-slate-50 hover:text-slate-700 transition inline-flex items-center shrink-0">

      <div class="flex items-center rounded-lg border border-slate-200 overflow-hidden shrink-0" :title="t('ctfModeToggle')">
        <button type="button" @click="setCtfMode('manual')" class="h-7 px-2 text-[11px] font-medium transition"

        <button type="button" @click="setCtfMode('ctf')" class="h-7 px-2 text-[11px] font-medium transition"

      </div>

      <div class="flex items-center rounded-lg border border-slate-200 overflow-hidden shrink-0" :title="t('language')">

        <button type="button" @click="setLang('zh')" class="h-7 px-2 text-[11px] font-medium transition"

      <button @click="loadSettings(); loadCtfConfig(); showSettings = true" class="h-7 w-7 rounded-lg border border-slate-200 text-slate-400 hover:bg-slate-50 hover:text-slate-600 transition inline-flex items-center justify-center shrink-0">

      </button>
    </div>
  </header>

  <div x-ref="projectListScroll" @scroll.passive="rememberProjectListScroll()" class="flex-1 overflow-y-auto p-4">
    <template x-if="projects.length === 0">
      <div class="flex flex-col items-center justify-center h-full text-slate-400">
        <img src="/static/favicon.svg" alt="" class="w-20 h-20 mb-5 opacity-30">
        <p class="text-lg font-medium text-slate-500" x-text="t('noProjectsYet')"></p>
        <p class="text-sm mt-1" x-text="t('createProjectHint')"></p>
      </div>
    </template>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">

        <div @click="openProject(p.id)"

          <div class="flex items-start justify-between mb-3">

              </button>
            </div>
            <div class="mt-2 flex flex-wrap items-center gap-1.5">

            </template>
            <template x-if="p.unclaimed_intent_count > 0">

            </template>
            <span class="flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 1 1 7.072 0l-.548.547A3.374 3.374 0 0 0 14 18.469V19a2 2 0 1 1-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547Z"/></svg>
              <span x-text="p.hint_count"></span>
            </span>
          </div>
          <div class="mt-1.5 flex items-center gap-1.5 text-[11px] text-slate-400">
            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M8 2v3M16 2v3"/><path d="M3.5 9.5h17"/><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M8 13h3M8 16h6"/></svg>
            <span x-text="formatDate(p.created_at)"></span>
          </div>
          <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-end gap-1.5">
            <div class="flex items-center justify-end gap-1.5 flex-wrap">
              <button type="button" @click.stop="viewProjectYaml(p.id, p.title)"
                class="px-2 py-1 rounded-lg border border-slate-200 text-[11px] text-slate-500 hover:bg-slate-50 hover:text-slate-700 transition flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M14.25 3H7.5A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h9a2.25 2.25 0 0 0 2.25-2.25V8.25L14.25 3Z"/><path d="M14.25 3v5.25h4.5"/><path d="M8.25 12h7.5M8.25 15h5.25"/></svg>
                <span x-text="t('snapshot')"></span>
              </button>
              <template x-if="p.status !== 'completed'">
                <button type="button" @click.stop="toggleProjectStopById(p.id, p.status)"
                  class="px-2 py-1 rounded-lg border text-[11px] transition flex items-center gap-1"
                  :class="p.status === 'active'
                    ? 'border-amber-200 text-amber-600 hover:bg-amber-50'
                    : 'border-teal-200 text-teal-600 hover:bg-teal-50'">
                  <svg x-show="p.status === 'active'" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                  <svg x-show="p.status === 'stopped'" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></svg>
                  <span x-text="p.status === 'active' ? t('stop') : t('resume')"></span>
                </button>
              </template>
              <template x-if="p.status === 'completed'">
                <button type="button" @click.stop="openReopenProject(p.id, p.title)"
                  class="px-2 py-1 rounded-lg border border-sky-200 text-[11px] text-sky-600 hover:bg-sky-50 transition flex items-center gap-1">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.708"/><path d="M3 3v6h6"/></svg>
                  <span x-text="t('reopen')"></span>
                </button>
              </template>
              <button type="button" @click.stop="deleteProjectById(p.id, p.title)"
                class="px-2 py-1 rounded-lg border border-rose-200 text-[11px] text-rose-500 hover:bg-rose-50 hover:text-rose-600 transition flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4.75A1.75 1.75 0 0 1 9.75 3h4.5A1.75 1.75 0 0 1 16 4.75V6"/><path d="M19 6l-.63 11.338A2 2 0 0 1 16.37 19.5H7.63a2 2 0 0 1-1.997-2.162L5 6"/><path d="M10 10.5v5"/><path d="M14 10.5v5"/></svg>
                <span x-text="t('delete')"></span>
              </button>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- ═══════════ CTF BOARD VIEW ═══════════ -->
<div x-show="view === 'ctf'" x-cloak class="flex-1 flex flex-col overflow-hidden">
  <header class="bg-white/80 backdrop-blur border-b border-slate-200/60 px-4 py-2.5 flex items-center gap-3 shrink-0">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="h-8 w-8 rounded-lg border border-slate-200 bg-white shadow-sm shadow-slate-200/40 flex items-center justify-center shrink-0 overflow-hidden">
        <img src="/static/favicon.svg" alt="" class="w-5 h-5 block">
      </div>
      <span class="font-semibold text-slate-700 tracking-tight" x-text="t('ctfBoard')"></span>
    </div>
    <div class="flex-1"></div>
    <div class="flex items-center gap-3 text-[11px] text-slate-400">
      <span class="inline-flex items-center gap-1.5 shrink-0" :title="t('ctfTotalPoints')">
        <span class="font-medium uppercase tracking-[0.12em] text-slate-400" x-text="t('ctfPoints')"></span>
        <span class="font-semibold text-slate-600 tabular-nums" x-text="ctfDisplayScore()"></span>
      </span>
      <span class="inline-flex items-center gap-1.5 shrink-0" :title="t('ctfSolved')">
        <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
        <span class="font-semibold text-emerald-700 tabular-nums" x-text="ctfCount('solved')"></span>
      </span>
      <span class="inline-flex items-center gap-1.5 shrink-0" :title="t('ctfSolving')">
        <span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>
        <span class="font-semibold text-amber-700 tabular-nums" x-text="ctfCount('solving')"></span>
      </span>
      <span class="inline-flex items-center gap-1.5 shrink-0" :title="t('ctfQueued')">
        <span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span>
        <span class="font-semibold text-slate-600 tabular-nums" x-text="ctfCount('queued')"></span>
      </span>
      <span class="inline-flex items-center gap-1.5 shrink-0" :title="t('ctfRemaining')">
        <span class="font-semibold text-slate-600 tabular-nums" x-text="ctfRemaining()"></span>
      </span>
      <span class="inline-flex items-center gap-1.5 shrink-0" x-show="ctfStatus && !ctfStatus.bridge_running && ctfConfigured()">
        <span class="h-1.5 w-1.5 rounded-full bg-rose-500 animate-pulse"></span>
        <span class="font-semibold text-rose-600" x-text="t('ctfBridgeOffline')"></span>
      </span>
      <span class="inline-flex items-center gap-1.5 shrink-0" x-show="ctfStatus && ctfStatus.last_model_error" :title="ctfStatus.last_model_error">
        <span class="h-1.5 w-1.5 rounded-full bg-rose-500 animate-pulse"></span>
        <span class="font-semibold text-rose-600" x-text="t('ctfModelError')"></span>
      </span>
    </div>
    <div class="flex items-center gap-1.5">
      <button @click="refreshCtfChallenges()" :disabled="ctfLoading"
        class="h-7 px-2.5 rounded-lg border border-brand-200 text-xs text-brand-600 hover:bg-brand-50 transition inline-flex items-center gap-1.5 disabled:cursor-not-allowed disabled:opacity-40">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        <span x-text="ctfLoading ? t('ctfSyncing') : t('ctfRefresh')"></span>
      </button>
    </div>
    <div class="flex items-center gap-1.5 ml-1">
      <div class="flex items-center rounded-lg border border-slate-200 overflow-hidden shrink-0" :title="t('ctfModeToggle')">
        <button type="button" @click="setCtfMode('manual')" class="h-7 px-2 text-[11px] font-medium transition"
          :class="ctfMode === 'manual' ? 'bg-slate-800 text-white' : 'text-slate-500 hover:bg-slate-50'"><span x-text="t('modeManual')"></span></button>
        <button type="button" @click="setCtfMode('ctf')" class="h-7 px-2 text-[11px] font-medium transition"
          :class="ctfMode === 'ctf' ? 'bg-brand-500 text-white' : 'text-slate-500 hover:bg-slate-50'"><span x-text="t('modeCtf')"></span></button>
      </div>
      <div class="flex items-center rounded-lg border border-slate-200 overflow-hidden shrink-0" :title="t('language')">
        <button type="button" @click="setLang('en')" class="h-7 px-2 text-[11px] font-medium transition"
          :class="lang === 'en' ? 'bg-slate-800 text-white' : 'text-slate-500 hover:bg-slate-50'">EN</button>
        <button type="button" @click="setLang('zh')" class="h-7 px-2 text-[11px] font-medium transition"
          :class="lang === 'zh' ? 'bg-slate-800 text-white' : 'text-slate-500 hover:bg-slate-50'">中文</button>
      </div>
      <button @click="loadSettings(); loadCtfConfig(); showSettings = true" class="h-7 w-7 rounded-lg border border-slate-200 text-slate-400 hover:bg-slate-50 hover:text-slate-600 transition inline-flex items-center justify-center shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7 7 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a7 7 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a7 7 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a7 7 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/><path d="M15 12a3 3 0 1 1-6 0-3 3 0 0 1 6 0Z"/></svg>
      </button>
    </div>
  </header>

  <div class="flex-1 overflow-y-auto p-4">
    <template x-if="!ctfConfigured()">
      <div class="flex flex-col items-center justify-center h-full text-slate-400">
        <svg class="w-16 h-16 mb-4 opacity-30" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24"><path d="M12 3l9 5v8l-9 5-9-5V8l9-5Z"/><path d="M12 12l9-5"/><path d="M12 12v9"/></svg>
        <p class="text-lg font-medium text-slate-500" x-text="t('ctfNotConfigured')"></p>
        <p class="text-sm mt-1" x-text="t('ctfConfigureHint')"></p>
        <button @click="loadCtfConfig(); showSettings = true" class="mt-4 h-8 px-3 rounded-lg border border-brand-200 text-xs text-brand-600 hover:bg-brand-50 transition inline-flex items-center">
          <span x-text="t('ctfOpenSettings')"></span>
        </button>
      </div>
    </template>

    <template x-if="ctfConfigured() && ctfChallenges.length === 0">
      <div class="flex flex-col items-center justify-center h-full text-slate-400">
        <img src="/static/favicon.svg" alt="" class="w-20 h-20 mb-5 opacity-30">
        <p class="text-lg font-medium text-slate-500" x-text="t('ctfNoChallenges')"></p>
        <button @click="refreshCtfChallenges()" class="mt-4 h-8 px-3 rounded-lg border border-brand-200 text-xs text-brand-600 hover:bg-brand-50 transition inline-flex items-center">
          <span x-text="t('ctfRefresh')"></span>
        </button>
      </div>
    </template>

    <div x-show="ctfConfigured() && (ctfSolvingCount() > 0 || ctfQueuedCount() > 0)" class="max-w-3xl mx-auto mb-3">
      <div class="bg-white rounded-2xl border border-slate-200/60 px-4 py-3">
        <div class="flex items-center gap-3">
          <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 shrink-0" x-text="t('ctfQueue')"></span>
          <div class="flex-1 h-1.5 rounded-full bg-slate-100 overflow-hidden">
            <div class="h-full bg-amber-400 transition-all duration-500" :style="'width:' + (ctfMaxConcurrent() ? (ctfSolvingCount() / ctfMaxConcurrent() * 100) : 0) + '%'"></div>
          </div>
          <span class="text-[11px] text-slate-500 tabular-nums shrink-0" x-text="ctfSolvingCount() + '/' + ctfMaxConcurrent() + ' ' + t('ctfSlots')"></span>
          <span class="text-[11px] shrink-0" :class="ctfFreeSlots() > 0 ? 'text-emerald-600' : 'text-amber-600'"
            x-text="ctfFreeSlots() > 0 ? ctfFreeSlots() + ' ' + t('ctfFreeSlot') : t('ctfNoFreeSlot')"></span>
        </div>
        <div x-show="ctfQueuedCount() > 0" class="mt-2.5 space-y-1.5 border-t border-slate-100 pt-2.5">
          <template x-for="(q, idx) in ctfQueueList()" :key="q.id">
            <div class="flex items-center gap-2 text-xs">
              <span class="inline-flex items-center justify-center h-4 w-4 rounded-full bg-slate-100 text-[10px] font-semibold text-slate-500 shrink-0" x-text="idx + 1"></span>
              <span class="text-slate-600 truncate" x-text="q.title"></span>
              <span class="shrink-0" :class="ctfFreeSlots() > 0 ? 'text-amber-500' : 'text-slate-400'"
                x-text="ctfFreeSlots() > 0 ? t('ctfWaitingOpen') : t('ctfWaitingSlot')"></span>
            </div>
          </template>
        </div>
      </div>
    </div>
    <div x-show="ctfConfigured() && ctfChallenges.length > 0" class="max-w-3xl mx-auto space-y-2.5">
      <template x-for="ch in ctfChallenges" :key="ch.id">
        <div class="bg-white rounded-2xl border border-slate-200/60 transition-all duration-200 hover:border-slate-300">
          <div class="flex items-center gap-3 px-4 py-3">
            <span class="h-2 w-2 rounded-full shrink-0" :class="ctfStatusDot(ch.status)" :title="ctfStatusLabel(ch.status)"></span>
            <div class="min-w-0 flex-1 cursor-pointer" @click="toggleCtfChallenge(ch.id)">
              <p class="font-medium text-slate-700 truncate text-sm"><span x-text="ch.title"></span></p>
              <p class="text-[11px] text-slate-400 truncate">
                <span x-text="ch.category || '—'"></span>
                <span> · </span>
                <span x-text="ch.points + 'pt'"></span>
                <template x-if="ch.target">
                  <span> · <span class="font-mono" x-text="ch.target"></span></span>
                </template>
              </p>
            </div>
            <div class="flex items-center gap-1.5 shrink-0 flex-wrap justify-end">
              <span class="px-2 py-0.5 rounded-full text-[11px] font-medium" :class="ctfStatusBadge(ch.status)"><span x-text="ch.status === 'queued' && ctfQueuedCount() > 1 ? ctfStatusLabel('queued') + ' #' + ctfQueuePosition(ch) : ctfStatusLabel(ch.status)"></span></span>
              <template x-if="ch.status === 'solved' && ch.last_flag">
                <span class="text-xs font-mono text-emerald-600 max-w-40 truncate" :title="ch.last_flag" x-text="ch.last_flag"></span>
              </template>
              <template x-if="ch.project_id">
                <button @click="openProject(ch.project_id)" class="h-7 px-2 rounded-lg border border-slate-200 text-[11px] text-slate-500 hover:bg-slate-50 hover:text-slate-700 transition inline-flex items-center gap-1">
                  <span x-text="t('ctfViewProject')"></span>
                </button>
              </template>
              <template x-if="ch.status === 'queued'">
                <button @click="startCtfChallenge(ch)" class="h-7 px-2 rounded-lg border border-brand-200 text-[11px] text-brand-600 hover:bg-brand-50 transition inline-flex items-center gap-1">
                  <span x-text="t('ctfStartSolve')"></span>
                </button>
              </template>
              <template x-if="ctfCanPause(ch.status)">
                <button @click="pauseCtfChallenge(ch)" class="h-7 px-2 rounded-lg border border-slate-200 text-[11px] text-slate-500 hover:bg-slate-50 hover:text-slate-700 transition">
                  <span x-text="t('ctfPause')"></span>
                </button>
              </template>
              <template x-if="ctfCanResume(ch.status)">
                <button @click="resumeCtfChallenge(ch)" class="h-7 px-2 rounded-lg border border-slate-200 text-[11px] text-slate-600 hover:bg-slate-50 transition">
                  <span x-text="t('ctfResume')"></span>
                </button>
              </template>
              <template x-if="ctfCanRetry(ch.status)">
                <button @click="retryCtfChallenge(ch)" class="h-7 px-2 rounded-lg border border-brand-200 text-[11px] text-brand-600 hover:bg-brand-50 transition">
                  <span x-text="t('ctfRetry')"></span>
                </button>
              </template>
              <template x-if="ctfCanStop(ch.status)">
                <button @click="stopCtfChallenge(ch)" class="h-7 px-2 rounded-lg border border-rose-200 text-[11px] text-rose-500 hover:bg-rose-50 transition">
                  <span x-text="t('ctfStop')"></span>
                </button>
              </template>
              <button @click="toggleCtfChallenge(ch.id)" class="h-7 w-7 rounded-lg border border-slate-200 text-slate-400 hover:bg-slate-50 hover:text-slate-600 transition inline-flex items-center justify-center">
                <svg class="w-3.5 h-3.5 transition-transform" :class="ctfExpandedId === ch.id ? 'rotate-180' : ''" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
              </button>
            </div>
          </div>
          <template x-if="ctfExpandedId === ch.id">
            <div class="border-t border-slate-100 px-4 py-3 text-sm space-y-2.5">
              <div>
                <p class="text-[11px] text-slate-400 font-medium uppercase tracking-wider mb-1" x-text="t('ctfDescription')"></p>
                <p class="text-slate-600 whitespace-pre-wrap text-xs" x-text="ch.description || '—'"></p>
              </div>
              <template x-if="ch.attachments && ch.attachments.length">
                <div>
                  <p class="text-[11px] text-slate-400 font-medium uppercase tracking-wider mb-1" x-text="t('ctfAttachments')"></p>
                  <div class="space-y-1">
                    <template x-for="url in ch.attachments" :key="url">
                      <a :href="url" target="_blank" rel="noopener" class="block text-xs text-brand-600 hover:underline truncate" x-text="url"></a>
                    </template>
                  </div>
                </div>
              </template>
              <template x-if="ch.hints && ch.hints.length">
                <div>
                  <p class="text-[11px] text-slate-400 font-medium uppercase tracking-wider mb-1" x-text="t('ctfHints')"></p>
                  <ul class="space-y-1">
                    <template x-for="h in ch.hints" :key="h">
                      <li class="text-xs text-slate-500" x-text="h"></li>
                    </template>
                  </ul>
                </div>
              </template>
              <div class="flex items-center gap-4 text-[11px] text-slate-400">
                <span><span x-text="t('ctfAttempts')"></span>: <span x-text="ch.attempt_count"></span></span>
                <span><span x-text="t('ctfLastFlag')"></span>: <span class="font-mono" x-text="ch.last_flag || t('ctfNoFlag')"></span></span>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>
</div>
<!-- ═══════════ VULNERABILITY MINING WORKSPACE ═══════════ -->
<template x-if="view === 'vulnerability'">
<div class="vuln-workspace flex-1 flex flex-col overflow-hidden">
  <header class="bg-white/90 backdrop-blur border-b border-slate-200/70 px-4 py-2.5 flex items-center gap-3 shrink-0 z-20">
    <button @click="backToList()" class="p-1.5 rounded-lg hover:bg-slate-100 transition text-slate-400 hover:text-slate-700" :title="t('vulnBackProjects')">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div class="h-8 w-8 rounded-lg bg-slate-900 text-sky-300 flex items-center justify-center shadow-sm">
      <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.25c0 4.49 3.2 8.7 7.5 9.75 4.3-1.05 7.5-5.26 7.5-9.75V6L12 3Z"/><path d="M9 12h6M12 9v6"/></svg>
    </div>
    <div class="min-w-0">
      <div class="flex items-center gap-2">
        <h1 class="text-sm font-semibold text-slate-800" x-text="t('vulnerabilityMining')"></h1>
        <span class="px-1.5 py-0.5 rounded-full border text-[9px] font-semibold uppercase tracking-wider" :class="vulnerabilityCampaign.authorized ? 'border-emerald-200 bg-emerald-50 text-emerald-700' : 'border-amber-200 bg-amber-50 text-amber-700'" x-text="vulnerabilityCampaign.authorized ? t('vulnAuthorized') : t('vulnAuthorizationRequired')"></span>
      </div>
      <select x-show="vulnerabilityCampaigns.length" x-model="vulnerabilitySelectedCampaignId" @change="vulnerabilitySelectCampaign(vulnerabilitySelectedCampaignId)" class="mt-0.5 max-w-64 border-0 bg-transparent p-0 text-[11px] text-slate-500 outline-none">
        <template x-for="campaignOption in vulnerabilityCampaigns" :key="campaignOption.id"><option :value="campaignOption.id" x-text="campaignOption.title"></option></template>
      </select>
      <p x-show="!vulnerabilityCampaigns.length" class="text-[11px] text-slate-400 truncate" x-text="t('vulnNoCampaign')"></p>
    </div>
    <div class="flex-1"></div>
    <div class="hidden md:flex items-center gap-1.5 text-[11px] text-slate-400">
      <span x-text="t('vulnLastUpdated')"></span>
      <span class="font-medium text-slate-600 tabular-nums" x-text="vulnerabilityUpdatedAt"></span>
    </div>
    <button @click="vulnerabilityRefreshRecon()" :disabled="vulnerabilityRefreshing" class="h-7 px-2.5 rounded-lg border border-slate-200 text-xs text-slate-600 hover:bg-slate-50 transition inline-flex items-center gap-1.5 disabled:opacity-50">
      <svg class="w-3.5 h-3.5" :class="{ 'vuln-refreshing': vulnerabilityRefreshing }" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg>
      <span x-text="vulnerabilityRefreshing ? t('vulnRefreshing') : t('vulnRefresh')"></span>
    </button>
    <div class="flex items-center rounded-lg border border-slate-200 overflow-hidden shrink-0" :title="t('language')">

 class="rounded-lg border border-amber-200 px-3 py-2 text-[10px] font-medium text-amber-700 disabled:opacity-50" x-text="t('vulnManualRetry')"></button></div><p x-show="task.last_error" class="mt-3 rounded-lg bg-rose-50 px-3 py-2 text-[10px] text-rose-600" x-text="task.last_error"></p></article></template></div>

            <div class="mt-4 space-y-4 text-xs">
              <div class="flex items-center justify-between"><div><div class="font-medium text-slate-700" x-text="t('vulnActiveTesting')"></div><div class="mt-1 text-[11px] text-slate-400" x-text="t('vulnActiveTestingHint')"></div></div><button @click="vulnerabilityUpdateCampaign({active_testing_enabled:!vulnerabilityCampaign.activeTesting})" :disabled="!vulnerabilitySelectedCampaignId" class="px-2.5 py-1.5 rounded-lg border text-[10px] font-medium disabled:opacity-40" :class="vulnerabilityCampaign.activeTesting ? 'border-rose-200 bg-rose-50 text-rose-700' : 'border-emerald-200 bg-emerald-50 text-emerald-700'" x-text="vulnerabilityCampaign.activeTesting ? t('vulnEnabled') : t('vulnDisabled')"></button></div>

              <div class="flex items-center justify-between"><div><div class="font-medium text-slate-700" x-text="t('vulnR2PolicyApproval')"></div><div class="mt-1 text-[11px] text-slate-400" x-text="t('vulnR2PolicyApprovalHint')"></div></div><button @click="vulnerabilityUpdateCampaign({r2_auto_approve:!vulnerabilityCampaign.r2AutoApprove})" :disabled="!vulnerabilitySelectedCampaignId || !vulnerabilityCampaign.r2Enabled" class="px-2.5 py-1.5 rounded-lg border text-[10px] font-medium disabled:opacity-40" :class="vulnerabilityCampaign.r2AutoApprove ? 'border-amber-200 bg-amber-50 text-amber-700' : 'border-slate-200 bg-slate-50 text-slate-500'" x-text="vulnerabilityCampaign.r2AutoApprove ? t('vulnEnabled') : t('vulnDisabled')"></button></div>
              <div class="flex items-center justify-between border-t border-slate-100 pt-4"><div><div class="font-medium text-slate-700" x-text="t('vulnAutoAnalysis')"></div><div class="mt-1 text-[11px] text-slate-400" x-text="t('vulnAutoAnalysisHint')"></div></div><button @click="vulnerabilityUpdateCampaign({auto_analysis_enabled:!vulnerabilityCampaign.autoAnalysisEnabled})" :disabled="!vulnerabilitySelectedCampaignId" class="px-2.5 py-1.5 rounded-lg border text-[10px] font-medium disabled:opacity-40" :class="vulnerabilityCampaign.autoAnalysisEnabled ? 'border-indigo-200 bg-indigo-50 text-indigo-700' : 'border-slate-200 bg-slate-50 text-slate-500'" x-text="vulnerabilityCampaign.autoAnalysisEnabled ? t('vulnEnabled') : t('vulnDisabled')"></button></div>
              <div class="flex items-center justify-between"><span class="text-slate-500" x-text="t('vulnAutoAnalysisBudget')"></span><span class="font-medium text-slate-700" x-text="`${vulnerabilityCampaign.autoAnalysisBudgetUnits || 8} / ${vulnerabilityCampaign.autoAnalysisDailyBudgetUnits || 20}`"></span></div>
              <label class="flex items-center justify-between border-t border-slate-100 pt-4"><span><span class="block text-slate-500" x-text="t('vulnAutoRetestDailyLimit')"></span><span class="mt-1 block text-[10px] text-slate-400" x-text="t('vulnAutoRetestDailyLimitHint')"></span></span><input :value="vulnerabilityCampaign.autoRetestDailyLimit" @change="vulnerabilityUpdateCampaign({auto_retest_daily_limit:Number($event.target.value)})" type="number" min="0" max="500" class="w-20 rounded-lg border border-slate-200 px-2 py-1.5 text-right text-xs"></label>
              <div class="flex items-center justify-between border-t border-slate-100 pt-4"><span class="text-slate-500" x-text="t('vulnRateLimit')"></span><span class="font-medium text-slate-700" x-text="`${vulnerabilityCampaign.rateLimit || 30} req/s`"></span></div>
              <div class="flex items-center justify-between"><span class="text-slate-500" x-text="t('vulnConcurrency')"></span><span class="font-medium text-slate-700" x-text="`${vulnerabilityCampaign.concurrency || 3} workers`"></span></div>
              <div class="flex items-center justify-between"><span class="text-slate-500" x-text="t('vulnRequestHeader')"></span><code class="rounded bg-slate-100 px-2 py-1 text-[10px] text-slate-600" x-text="vulnerabilityCampaign.requestHeader"></code></div>
              <div class="flex items-center justify-between"><span class="text-slate-500" x-text="t('vulnR2Proxy')"></span><code class="max-w-[12rem] truncate rounded bg-slate-100 px-2 py-1 text-[10px] text-slate-600" x-text="vulnerabilityCampaign.r2ProxyUrl || t('vulnDirectConnection')"></code></div>

          <article class="vuln-card rounded-2xl p-5"><div class="flex items-center justify-between"><div><h3 class="text-sm font-semibold text-slate-700" x-text="t('vulnSnapshots')"></h3><p class="mt-1 text-[11px] text-slate-400" x-text="t('vulnSnapshotsHint')"></p></div><span class="rounded-full bg-indigo-50 px-2 py-1 text-[10px] text-indigo-600" x-text="vulnerabilitySnapshots.length"></span></div><div class="mt-4 max-h-72 space-y-2 overflow-y-auto"><template x-for="snapshot in vulnerabilitySnapshots" :key="snapshot.id"><div class="rounded-xl border border-slate-100 bg-slate-50 px-3 py-2.5"><div class="flex items-center justify-between"><span class="font-mono text-[10px] text-slate-500" x-text="snapshot.id"></span><span class="text-[10px] text-slate-400" x-text="snapshot.time"></span></div><p class="mt-1 break-words text-[10px] text-slate-500" x-text="snapshot.summaryText"></p></div></template><div x-show="!vulnerabilitySnapshots.length" class="py-6 text-center text-xs text-slate-400" x-text="t('vulnNoSnapshots')"></div></div></article>

  <!-- Recon asset detail drawer -->
  <div x-show="vulnerabilityShowAssetDetail" x-cloak class="fixed inset-0 z-[60] flex justify-end" @keydown.escape.window="vulnerabilityCloseAssetDetail()">
    <button type="button" @click="vulnerabilityCloseAssetDetail()" class="absolute inset-0 bg-slate-950/35 backdrop-blur-sm" :aria-label="t('close')"></button>
    <aside x-transition:enter="transition ease-out duration-200" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full" class="relative flex h-full w-full max-w-4xl flex-col bg-slate-50 shadow-2xl" role="dialog" aria-modal="true" :aria-label="t('vulnAssetDetail')">
      <header class="flex items-start gap-4 border-b border-slate-200 bg-white px-5 py-4 sm:px-6">
        <div class="min-w-0 flex-1"><div class="flex flex-wrap items-center gap-2"><span class="rounded-full bg-sky-50 px-2 py-1 text-[10px] font-medium text-sky-700" x-text="vulnerabilitySelectedAsset?.type"></span><span class="rounded-full border px-2 py-1 text-[10px]" :class="vulnerabilitySelectedAsset?.freshnessState === 'stale' ? 'border-amber-200 bg-amber-50 text-amber-700' : 'border-emerald-200 bg-emerald-50 text-emerald-700'" x-text="vulnerabilitySelectedAsset?.freshnessState"></span><span class="font-mono text-[10px] text-slate-400" x-text="vulnerabilitySelectedAsset?.id"></span></div><h2 class="mt-2 truncate text-lg font-semibold text-slate-800" x-text="vulnerabilitySelectedAsset?.identifier"></h2><p class="mt-1 text-xs text-slate-400" x-text="vulnerabilityAssetSourceLabel(vulnerabilitySelectedAsset || {sources:[]})"></p></div>
        <div class="text-right"><div class="text-[10px] text-slate-400" x-text="t('vulnRiskScore')"></div><div class="mt-1 text-2xl font-semibold text-slate-800" x-text="vulnerabilitySelectedAsset ? vulnerabilityAssetRiskScore(vulnerabilitySelectedAsset) : 0"></div></div>
        <button @click="vulnerabilityCloseAssetDetail()" class="rounded-lg p-2 text-slate-400 hover:bg-slate-100" :aria-label="t('close')">✕</button>
      </header>
      <div x-show="vulnerabilityAssetDetailLoading" class="flex flex-1 items-center justify-center text-xs text-sky-600" x-text="t('vulnAssetDetailLoading')"></div>
      <div x-show="!vulnerabilityAssetDetailLoading" class="flex-1 space-y-4 overflow-y-auto p-4 sm:p-6">
        <section class="grid grid-cols-2 gap-3 lg:grid-cols-4"><div class="vuln-card rounded-xl p-3"><div class="text-[10px] text-slate-400" x-text="t('vulnScope')"></div><div class="mt-1 text-xs font-semibold text-slate-700" x-text="vulnerabilitySelectedAsset?.scope"></div></div><div class="vuln-card rounded-xl p-3"><div class="text-[10px] text-slate-400" x-text="t('vulnImportance')"></div><div class="mt-1 text-xs font-semibold text-slate-700" x-text="vulnerabilitySelectedAsset?.importance"></div></div><div class="vuln-card rounded-xl p-3"><div class="text-[10px] text-slate-400" x-text="t('vulnFirstSeen')"></div><div class="mt-1 text-xs font-semibold text-slate-700" x-text="vulnerabilityFormatTime(vulnerabilitySelectedAsset?.firstSeenAt)"></div></div><div class="vuln-card rounded-xl p-3"><div class="text-[10px] text-slate-400" x-text="t('vulnLastSeen')"></div><div class="mt-1 text-xs font-semibold text-slate-700" x-text="vulnerabilityFormatTime(vulnerabilitySelectedAsset?.lastSeenAt)"></div></div></section>

        <section class="vuln-card rounded-2xl p-5"><div class="flex items-center justify-between"><div><h3 class="text-sm font-semibold text-slate-700" x-text="t('vulnAssetCoverageMatrix')"></h3><p class="mt-1 text-[11px] text-slate-400" x-text="t('vulnAssetCoverageMatrixHint')"></p></div><span class="text-[10px] text-slate-400" x-text="vulnerabilityCoverageLabel(vulnerabilitySelectedAsset || {})"></span></div><div class="mt-4 grid grid-cols-2 gap-3 lg:grid-cols-3"><template x-for="coverage in vulnerabilityAssetCoverage" :key="coverage.dimension"><div class="rounded-xl border border-slate-100 bg-slate-50 p-3"><div class="flex items-center justify-between gap-2"><span class="text-xs font-medium text-slate-700" x-text="coverage.dimension"></span><span class="rounded-full border px-2 py-1 text-[9px]" :class="vulnerabilityStatusClass(coverage.status)" x-text="coverage.status"></span></div><div class="mt-3 flex items-center justify-between text-[10px] text-slate-400"><span x-text="t('vulnProducedEvidence')"></span><strong class="text-slate-600" x-text="vulnerabilityCoverageEvidenceCount(coverage.dimension)"></strong></div><p x-show="coverage.error" class="mt-2 truncate text-[10px] text-rose-500" x-text="coverage.error"></p></div></template></div></section>

        <div class="grid grid-cols-1 gap-4 xl:grid-cols-2">
          <section class="vuln-card rounded-2xl p-5"><div class="flex items-center justify-between"><div><h3 class="text-sm font-semibold text-slate-700" x-text="t('vulnEvidenceList')"></h3><p class="mt-1 text-[11px] text-slate-400" x-text="t('vulnEvidenceListHint')"></p></div><span class="rounded-full bg-sky-50 px-2 py-1 text-[10px] text-sky-700" x-text="vulnerabilityAssetObservations.length"></span></div><div class="mt-4 max-h-96 space-y-3 overflow-y-auto"><template x-for="observation in vulnerabilityAssetObservations" :key="observation.id"><article class="rounded-xl border border-slate-100 bg-slate-50 p-3"><div class="flex items-center justify-between gap-3"><span class="text-[10px] font-semibold text-sky-700" x-text="vulnerabilitySourceName(observation.source_id)"></span><span class="text-[10px] text-slate-400" x-text="vulnerabilityFormatTime(observation.last_seen_at)"></span></div><p class="mt-2 break-words text-[11px] leading-relaxed text-slate-600" x-text="vulnerabilityObservationSummary(observation)"></p><div class="mt-2 flex items-center justify-between gap-3 font-mono text-[9px] text-slate-400"><span class="truncate" x-text="observation.evidence_hash"></span><span class="shrink-0" x-text="`${Math.round(observation.confidence * 100)}%`"></span></div></article></template><div x-show="!vulnerabilityAssetObservations.length" class="py-8 text-center text-xs text-slate-400" x-text="t('vulnNoEvidence')"></div></div></section>
          <section class="vuln-card rounded-2xl p-5"><div class="flex items-center justify-between"><div><h3 class="text-sm font-semibold text-slate-700" x-text="t('vulnRelationMiniGraph')"></h3><p class="mt-1 text-[11px] text-slate-400" x-text="t('vulnRelationMiniGraphHint')"></p></div><span class="rounded-full bg-indigo-50 px-2 py-1 text-[10px] text-indigo-600" x-text="vulnerabilityAssetRelations().length"></span></div><div id="vulnerabilityAssetRelationChart" class="mt-3 h-80 w-full"></div><div x-show="!vulnerabilityAssetRelations().length" class="-mt-44 text-center text-xs text-slate-400" x-text="t('vulnNoRelations')"></div></section>

        <section class="grid grid-cols-1 gap-4 xl:grid-cols-3">
          <article class="vuln-card rounded-2xl p-4"><div class="flex items-center justify-between"><h3 class="text-xs font-semibold text-slate-700" x-text="t('vulnRelatedTasks')"></h3><span class="text-[10px] text-slate-400" x-text="vulnerabilityAssetCollectionTasks.length"></span></div><div class="mt-3 space-y-2"><template x-for="task in vulnerabilityAssetCollectionTasks.slice(0, 8)" :key="task.id"><div class="rounded-xl bg-slate-50 p-3"><div class="flex items-center justify-between gap-2"><span class="truncate font-mono text-[10px] text-slate-500" x-text="task.adapter"></span><span class="rounded-full border px-2 py-1 text-[9px]" :class="vulnerabilityStatusClass(task.status)" x-text="task.status"></span></div></div></template><div x-show="!vulnerabilityAssetCollectionTasks.length" class="py-6 text-center text-[10px] text-slate-400" x-text="t('vulnNoRelatedTasks')"></div></div></article>
          <article class="vuln-card rounded-2xl p-4"><div class="flex items-center justify-between"><h3 class="text-xs font-semibold text-slate-700" x-text="t('vulnRelatedFindings')"></h3><span class="text-[10px] text-slate-400" x-text="vulnerabilityAssetFindings().length"></span></div><div class="mt-3 space-y-2"><template x-for="finding in vulnerabilityAssetFindings().slice(0, 8)" :key="finding.id"><div class="rounded-xl bg-slate-50 p-3"><div class="flex items-center gap-2"><span class="rounded-full border px-2 py-1 text-[9px]" :class="vulnerabilitySeverityClass(finding.severity)" x-text="finding.severity"></span><span class="truncate text-[10px] font-medium text-slate-600" x-text="finding.title"></span></div></div></template><div x-show="!vulnerabilityAssetFindings().length" class="py-6 text-center text-[10px] text-slate-400" x-text="t('vulnNoRelatedFindings')"></div></div></article>

  <!-- Finding detail and deterministic retest history -->
  <div x-show="vulnerabilityShowFindingDetail" x-cloak class="fixed inset-0 z-[75] flex items-center justify-center bg-slate-950/45 p-4 backdrop-blur-sm" @keydown.escape.window="vulnerabilityCloseFindingDetail()">
    <section @click.outside="vulnerabilityCloseFindingDetail()" class="flex max-h-[88vh] w-full max-w-3xl flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl" role="dialog" aria-modal="true" :aria-label="t('vulnFindingDetail')">
      <header class="flex items-start justify-between gap-4 border-b border-slate-100 px-6 py-5"><div class="min-w-0"><div class="flex flex-wrap items-center gap-2"><span class="font-mono text-[10px] text-slate-400" x-text="vulnerabilitySelectedFinding?.id"></span><span class="rounded-full border px-2 py-1 text-[9px]" :class="vulnerabilityStatusClass(vulnerabilitySelectedFinding?.status)" x-text="vulnerabilitySelectedFinding?.status"></span></div><h2 class="mt-2 truncate text-lg font-semibold text-slate-800" x-text="vulnerabilitySelectedFinding?.title"></h2><p class="mt-1 text-xs text-slate-400" x-text="vulnerabilitySelectedFinding?.asset"></p></div><button @click="vulnerabilityCloseFindingDetail()" class="rounded-lg p-2 text-slate-400 hover:bg-slate-100" :aria-label="t('close')">✕</button></header>
      <div class="grid flex-1 grid-cols-1 gap-4 overflow-y-auto p-5 lg:grid-cols-2"><article class="rounded-2xl border border-slate-100 p-4"><h3 class="text-xs font-semibold text-slate-700" x-text="t('vulnEvidenceList')"></h3><div class="mt-3 space-y-2"><template x-for="evidence in (vulnerabilitySelectedFinding?.evidence || [])" :key="evidence.id"><div class="rounded-xl bg-slate-50 p-3"><div class="text-[10px] font-medium text-slate-700" x-text="evidence.title"></div><p class="mt-1 max-h-24 overflow-hidden break-words text-[9px] text-slate-400" x-text="evidence.content"></p></div></template><div x-show="!(vulnerabilitySelectedFinding?.evidence || []).length" class="py-6 text-center text-[10px] text-slate-400" x-text="t('vulnNoEvidence')"></div></div></article><article class="rounded-2xl border border-amber-100 p-4"><div class="flex items-center justify-between"><h3 class="text-xs font-semibold text-slate-700" x-text="t('vulnRetestHistory')"></h3><span class="rounded-full bg-amber-50 px-2 py-1 text-[9px] text-amber-700" x-text="vulnerabilityFindingRetestTasks().length"></span></div><div class="mt-3 space-y-2"><template x-for="task in vulnerabilityFindingRetestTasks()" :key="task.id"><div class="rounded-xl bg-amber-50/40 p-3"><div class="flex items-center justify-between gap-2"><span class="font-mono text-[9px] text-slate-500" x-text="task.id"></span><span class="rounded-full border px-2 py-1 text-[9px]" :class="vulnerabilityStatusClass(task.status)" x-text="task.status"></span></div><p class="mt-2 text-[10px] font-medium text-slate-700" x-text="task.adapter"></p><p class="mt-1 break-all font-mono text-[9px] text-slate-400" x-text="task.target"></p><div x-show="task.status === 'pending_approval'" class="mt-3 flex gap-2"><button @click="vulnerabilityOpenTaskApproval(task, 'approve')" class="rounded-lg bg-emerald-600 px-3 py-1.5 text-[10px] font-medium text-white" x-text="t('vulnApprove')"></button><button @click="vulnerabilityOpenTaskApproval(task, 'reject')" class="rounded-lg border border-rose-200 bg-white px-3 py-1.5 text-[10px] font-medium text-rose-600" x-text="t('vulnReject')"></button></div></div></template><div x-show="!vulnerabilityFindingRetestTasks().length" class="py-6 text-center text-[10px] text-slate-400" x-text="t('vulnNoRetestHistory')"></div></div></article></div>
    </section>
  </div>

  <!-- Collection job approval dialog -->
  <div x-show="vulnerabilityTaskApproval.open" x-cloak class="fixed inset-0 z-[80] flex items-center justify-center bg-slate-950/45 p-4 backdrop-blur-sm" @keydown.escape.window="vulnerabilityCloseTaskApproval()">
    <section @click.outside="vulnerabilityCloseTaskApproval()" class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white shadow-2xl" role="dialog" aria-modal="true" :aria-label="t('vulnTaskApprovalTitle')">
      <header class="flex items-start justify-between border-b border-slate-100 px-5 py-4"><div><div class="text-[10px] font-semibold uppercase tracking-wider" :class="vulnerabilityTaskApproval.decision === 'approve' ? 'text-emerald-600' : 'text-rose-600'" x-text="vulnerabilityTaskApproval.decision"></div><h2 class="mt-1 text-base font-semibold text-slate-800" x-text="t('vulnTaskApprovalTitle')"></h2><p class="mt-1 font-mono text-[10px] text-slate-400" x-text="vulnerabilityTaskApproval.task?.adapter"></p></div><button @click="vulnerabilityCloseTaskApproval()" class="text-slate-400">✕</button></header>
      <div class="space-y-4 px-5 py-5"><div class="rounded-xl border border-amber-100 bg-amber-50 p-3 text-[11px] leading-relaxed text-amber-700" x-text="t('vulnTaskApprovalAuditHint')"></div><label class="block"><span class="text-xs font-medium text-slate-700" x-text="t('vulnApprovalReason')"></span><textarea x-model="vulnerabilityTaskApproval.reason" rows="5" maxlength="2000" :placeholder="t('vulnApprovalReasonPlaceholder')" class="mt-2 w-full resize-none rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-sky-400"></textarea></label></div>
      <footer class="flex justify-end gap-2 border-t border-slate-100 bg-slate-50 px-5 py-4"><button @click="vulnerabilityCloseTaskApproval()" class="px-3 py-2 text-xs text-slate-500" x-text="t('cancel')"></button><button @click="vulnerabilitySubmitTaskApproval()" :disabled="!vulnerabilityTaskApproval.reason.trim() || vulnerabilityTaskApproval.submitting" class="rounded-lg px-4 py-2 text-xs font-medium text-white disabled:opacity-40" :class="vulnerabilityTaskApproval.decision === 'approve' ? 'bg-emerald-600' : 'bg-rose-600'" x-text="vulnerabilityTaskApproval.submitting ? t('vulnSubmitting') : (vulnerabilityTaskApproval.decision === 'approve' ? t('vulnApprove') : t('vulnReject'))"></button></footer>
    </section>
  </div>

  <!-- Campaign creation wizard. Authorization is validated again by the API. -->
  <div x-show="vulnerabilityShowCreate" x-cloak x-transition.opacity @keydown.escape.window="vulnerabilityCloseCreate()" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/45 p-4 backdrop-blur-sm">
    <section @click.outside="vulnerabilityCloseCreate()" class="w-full max-w-2xl overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl" role="dialog" aria-modal="true" :aria-label="t('vulnCreateCampaignTitle')">
      <header class="border-b border-slate-100 px-6 py-5">
        <div class="flex items-start justify-between gap-4">
          <div><p class="text-[10px] font-semibold uppercase tracking-[0.16em] text-sky-600" x-text="t('vulnCreateMockBadge')"></p><h2 class="mt-1 text-lg font-semibold text-slate-800" x-text="t('vulnCreateCampaignTitle')"></h2><p class="mt-1 text-xs text-slate-400" x-text="t('vulnCreateCampaignHint')"></p></div>
          <button type="button" @click="vulnerabilityCloseCreate()" class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-700" :aria-label="t('close')"><svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
        <div class="mt-5 grid grid-cols-3 gap-2">
          <template x-for="step in [{id:1,key:'vulnBasicInfo'},{id:2,key:'vulnAuthorization'},{id:3,key:'vulnPolicy'}]" :key="step.id"><div><div class="h-1.5 rounded-full transition-colors" :class="vulnerabilityCreateStep >= step.id ? 'bg-sky-500' : 'bg-slate-100'"></div><div class="mt-2 flex items-center gap-1.5 text-[10px]" :class="vulnerabilityCreateStep >= step.id ? 'text-slate-700' : 'text-slate-400'"><span class="font-semibold" x-text="step.id"></span><span x-text="t(step.key)"></span></div></div></template>
        </div>
      </header>

      <div class="min-h-[300px] px-6 py-5">
        <div x-show="vulnerabilityCreateStep === 1" class="space-y-5">
          <label class="block"><span class="text-xs font-medium text-slate-700" x-text="t('vulnCampaignTitle')"></span><input x-model="vulnerabilityCreateForm.title" type="text" maxlength="120" :placeholder="t('vulnCampaignTitlePlaceholder')" class="mt-2 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-700 outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100"></label>
          <label class="block"><span class="text-xs font-medium text-slate-700" x-text="t('vulnObjective')"></span><textarea x-model="vulnerabilityCreateForm.objective" rows="5" maxlength="1000" :placeholder="t('vulnObjectivePlaceholder')" class="mt-2 w-full resize-none rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-700 outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100"></textarea></label>
        </div>

        <div x-show="vulnerabilityCreateStep === 2" class="space-y-5">
          <label class="flex cursor-pointer gap-3 rounded-xl border border-amber-200 bg-amber-50/70 p-4"><input x-model="vulnerabilityCreateForm.authorized" type="checkbox" class="mt-0.5 h-4 w-4 rounded border-amber-300 text-sky-600 focus:ring-sky-400"><span><span class="block text-xs font-semibold text-amber-900" x-text="t('vulnAuthorizationConfirm')"></span><span class="mt-1 block text-[11px] leading-relaxed text-amber-700" x-text="t('vulnAuthorizationConfirmHint')"></span></span></label>
          <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
            <label class="block"><span class="text-xs font-medium text-slate-700" x-text="t('vulnAuthorizationExpiry')"></span><input x-model="vulnerabilityCreateForm.authorizationExpiresAt" type="date" class="mt-2 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-700 outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100"></label>
            <label class="block"><span class="text-xs font-medium text-slate-700" x-text="t('vulnScopeLines')"></span><textarea x-model="vulnerabilityCreateForm.scopeText" rows="5" :placeholder="t('vulnScopeLinesPlaceholder')" class="mt-2 w-full resize-none rounded-xl border border-slate-200 px-3.5 py-2.5 font-mono text-xs text-slate-700 outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100"></textarea></label>
          </div>
        </div>

        <div x-show="vulnerabilityCreateStep === 3" class="space-y-5">
          <label class="flex cursor-pointer gap-3 rounded-xl border border-rose-100 bg-rose-50/60 p-4"><input x-model="vulnerabilityCreateForm.activeTesting" type="checkbox" class="mt-0.5 h-4 w-4 rounded border-rose-300 text-rose-600 focus:ring-rose-400"><span><span class="block text-xs font-semibold text-rose-900" x-text="t('vulnEnableActiveTesting')"></span><span class="mt-1 block text-[11px] leading-relaxed text-rose-700" x-text="t('vulnEnableActiveTestingHint')"></span></span></label>
          <label class="block max-w-xs"><span class="text-xs font-medium text-slate-700" x-text="t('vulnRequestsPerSecond')"></span><input x-model.number="vulnerabilityCreateForm.rateLimit" type="number" min="1" max="1000" class="mt-2 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-700 outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100"></label>
          <div class="rounded-xl border border-sky-100 bg-sky-50 p-4 text-[11px] leading-relaxed text-sky-800" x-text="t('vulnMockSafetySummary')"></div>
        </div>
      </div>

      <footer class="flex items-center justify-between border-t border-slate-100 bg-slate-50/70 px-6 py-4">
        <button type="button" @click="vulnerabilityCloseCreate()" class="px-3 py-2 text-xs font-medium text-slate-500 hover:text-slate-800" x-text="t('cancel')"></button>
        <div class="flex items-center gap-2"><button x-show="vulnerabilityCreateStep > 1" type="button" @click="vulnerabilityPreviousCreateStep()" class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-50" x-text="t('vulnPrevious')"></button><button x-show="vulnerabilityCreateStep < 3" type="button" @click="vulnerabilityNextCreateStep()" :disabled="!vulnerabilityCanContinueCreate()" class="rounded-lg bg-slate-900 px-4 py-2 text-xs font-medium text-white hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-35" x-text="t('vulnNext')"></button><button x-show="vulnerabilityCreateStep === 3" type="button" @click="vulnerabilityFinishCreate()" :disabled="!vulnerabilityCanContinueCreate() || vulnerabilitySubmitting" class="rounded-lg bg-sky-600 px-4 py-2 text-xs font-medium text-white hover:bg-sky-700 disabled:cursor-not-allowed disabled:opacity-35" x-text="vulnerabilitySubmitting ? t('vulnCreating') : t('vulnCreateMock')"></button></div>
      </footer>
    </section>
  </div>

  <!-- Manual asset import -->
  <div x-show="vulnerabilityShowImport" x-cloak x-transition.opacity @keydown.escape.window="vulnerabilityShowImport = false" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/45 p-4 backdrop-blur-sm">
    <section @click.outside="vulnerabilityShowImport = false" class="w-full max-w-xl rounded-2xl border border-slate-200 bg-white shadow-2xl" role="dialog" aria-modal="true" :aria-label="t('vulnImportAssets')"><header class="flex items-start justify-between border-b border-slate-100 px-6 py-5"><div><h2 class="text-lg font-semibold text-slate-800" x-text="t('vulnImportAssets')"></h2><p class="mt-1 text-xs text-slate-400" x-text="t('vulnImportAssetsHint')"></p></div><button @click="vulnerabilityShowImport = false" class="text-slate-400" :aria-label="t('close')">✕</button></header><div class="space-y-4 px-6 py-5"><label class="block"><span class="text-xs font-medium text-slate-700" x-text="t('vulnAssetType')"></span><select x-model="vulnerabilityImportForm.assetType" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm"><option value="domain">Domain</option><option value="ip">IP</option><option value="url">URL</option><option value="repository">Repository</option><option value="cloud">Cloud</option></select></label><label class="block"><span class="text-xs font-medium text-slate-700" x-text="t('vulnIdentifiersLines')"></span><textarea x-model="vulnerabilityImportForm.identifiers" rows="8" :placeholder="t('vulnIdentifiersPlaceholder')" class="mt-2 w-full resize-none rounded-xl border border-slate-200 px-3 py-2.5 font-mono text-xs"></textarea></label><p class="rounded-xl bg-amber-50 p-3 text-[11px] text-amber-700" x-text="t('vulnImportScopeHint')"></p></div><footer class="flex justify-end gap-2 border-t border-slate-100 bg-slate-50/70 px-6 py-4"><button @click="vulnerabilityShowImport = false" class="px-3 py-2 text-xs text-slate-500" x-text="t('cancel')"></button><button @click="vulnerabilityImportAssets()" :disabled="!vulnerabilityImportForm.identifiers.trim() || vulnerabilitySubmitting" class="rounded-lg bg-sky-600 px-4 py-2 text-xs font-medium text-white disabled:opacity-35" x-text="t('vulnImport')"></button></footer></section>
  </div>

  <!-- Candidate finding creation -->
  <!-- Convert a reviewed AI hypothesis into a candidate finding. -->
  <div x-show="vulnerabilityShowHypothesisFinding" x-cloak x-transition.opacity @keydown.escape.window="vulnerabilityShowHypothesisFinding = false" class="fixed inset-0 z-[65] flex items-center justify-center bg-slate-950/45 p-4 backdrop-blur-sm">
    <section @click.outside="vulnerabilityShowHypothesisFinding = false" class="w-full max-w-2xl rounded-2xl border border-slate-200 bg-white shadow-2xl" role="dialog" aria-modal="true" :aria-label="t('vulnFindingFromAsset')">
      <header class="flex items-start justify-between border-b border-slate-100 px-6 py-5"><div><h2 class="text-lg font-semibold text-slate-800" x-text="t('vulnFindingFromAsset')"></h2><p class="mt-1 text-xs text-slate-400" x-text="t('vulnFindingFromAssetHint')"></p></div><button @click="vulnerabilityShowHypothesisFinding = false" class="text-slate-400" :aria-label="t('close')">✕</button></header>
      <div class="space-y-4 px-6 py-5">
        <label class="block"><span class="text-xs font-medium text-slate-700" x-text="t('vulnAIHypotheses')"></span><select x-model="vulnerabilityHypothesisFindingForm.hypothesisId" @change="vulnerabilitySyncHypothesisFindingAsset()" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm"><template x-for="hypothesis in vulnerabilityConvertibleHypotheses()" :key="hypothesis.id"><option :value="hypothesis.id" x-text="`${hypothesis.title} · ${hypothesis.confidenceLabel}`"></option></template></select></label>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2"><label class="block"><span class="text-xs font-medium text-slate-700" x-text="t('vulnAsset')"></span><select x-model="vulnerabilityHypothesisFindingForm.assetId" :disabled="Boolean(vulnerabilityConvertibleHypotheses().find(item => item.id === vulnerabilityHypothesisFindingForm.hypothesisId)?.asset_id)" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm disabled:bg-slate-50"><template x-for="asset in vulnerabilityAssets.filter(item => item.scope === 'in')" :key="asset.id"><option :value="asset.id" x-text="asset.identifier"></option></template></select></label><label class="block"><span class="text-xs font-medium text-slate-700" x-text="t('vulnSeverity')"></span><select x-model="vulnerabilityHypothesisFindingForm.severity" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm"><option value="unknown">unknown</option><option value="info">info</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option><option value="critical">critical</option></select></label></div>
        <div class="rounded-xl border border-indigo-100 bg-indigo-50/50 p-4"><template x-if="vulnerabilityConvertibleHypotheses().find(item => item.id === vulnerabilityHypothesisFindingForm.hypothesisId)"><div><h3 class="text-xs font-semibold text-slate-700" x-text="vulnerabilityConvertibleHypotheses().find(item => item.id === vulnerabilityHypothesisFindingForm.hypothesisId).title"></h3><p class="mt-2 text-[11px] leading-relaxed text-slate-500" x-text="vulnerabilityConvertibleHypotheses().find(item => item.id === vulnerabilityHypothesisFindingForm.hypothesisId).description"></p></div></template></div>
        <p class="rounded-xl border border-amber-100 bg-amber-50 px-3 py-2.5 text-[11px] text-amber-700" x-text="t('vulnHypothesisCandidateSafety')"></p>
      </div>
      <footer class="flex justify-end gap-2 border-t border-slate-100 bg-slate-50/70 px-6 py-4"><button @click="vulnerabilityShowHypothesisFinding = false" class="px-3 py-2 text-xs text-slate-500" x-text="t('cancel')"></button><button @click="vulnerabilityCreateFindingFromHypothesis()" :disabled="!vulnerabilityHypothesisFindingForm.assetId || !vulnerabilityHypothesisFindingForm.hypothesisId || vulnerabilitySubmitting" class="rounded-lg bg-indigo-600 px-4 py-2 text-xs font-medium text-white disabled:opacity-35" x-text="vulnerabilitySubmitting ? t('vulnSubmitting') : t('vulnCreateCandidate')"></button></footer>
    </section>
  </div>

  <div x-show="vulnerabilityShowFinding" x-cloak x-transition.opacity @keydown.escape.window="vulnerabilityShowFinding = false" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/45 p-4 backdrop-blur-sm">
    <section @click.outside="vulnerabilityShowFinding = false" class="w-full max-w-2xl rounded-2xl border border-slate-200 bg-white shadow-2xl" role="dialog" aria-modal="true" :aria-label="t('vulnAddFinding')"><header class="flex items-start justify-between border-b border-slate-100 px-6 py-5"><div><h2 class="text-lg font-semibold text-slate-800" x-text="t('vulnAddFinding')"></h2><p class="mt-1 text-xs text-slate-400" x-text="t('vulnFindingCreateHint')"></p></div><button @click="vulnerabilityShowFinding = false" class="text-slate-400" :aria-label="t('close')">✕</button></header><div class="grid grid-cols-1 gap-4 px-6 py-5 md:grid-cols-2"><label class="block"><span class="text-xs font-medium text-slate-700" x-text="t('vulnAsset')"></span><select x-model="vulnerabilityFindingForm.assetId" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm"><template x-for="asset in vulnerabilityAssets.filter(item => item.scope === 'in')" :key="asset.id"><option :value="asset.id" x-text="asset.identifier"></option></template></select></label><label class="block"><span class="text-xs font-medium text-slate-700" x-text="t('vulnFindingType')"></span><input x-model="vulnerabilityFindingForm.findingType" type="text" placeholder="BOLA / XSS / Misconfiguration" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm"></label><label class="block md:col-span-2"><span class="text-xs font-medium text-slate-700" x-text="t('vulnFindingTitle')"></span><input x-model="vulnerabilityFindingForm.title" type="text" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm"></label><label class="block md:col-span-2"><span class="text-xs font-medium text-slate-700" x-text="t('vulnDescription')"></span><textarea x-model="vulnerabilityFindingForm.description" rows="5" class="mt-2 w-full resize-none rounded-xl border border-slate-200 px-3 py-2.5 text-sm"></textarea></label><label class="block"><span class="text-xs font-medium text-slate-700" x-text="t('vulnSeverity')"></span><select x-model="vulnerabilityFindingForm.severity" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm"><option value="low">low</option><option value="medium">medium</option><option value="high">high</option><option value="critical">critical</option></select></label><label class="block"><span class="text-xs font-medium text-slate-700" x-text="t('vulnConfidence')"></span><input x-model.number="vulnerabilityFindingForm.confidence" type="number" min="0" max="100" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm"></label></div><footer class="flex justify-end gap-2 border-t border-slate-100 bg-slate-50/70 px-6 py-4"><button @click="vulnerabilityShowFinding = false" class="px-3 py-2 text-xs text-slate-500" x-text="t('cancel')"></button><button @click="vulnerabilityCreateFinding()" :disabled="!vulnerabilityFindingForm.assetId || !vulnerabilityFindingForm.title.trim() || !vulnerabilityFindingForm.description.trim() || !vulnerabilityFindingForm.findingType.trim() || vulnerabilitySubmitting" class="rounded-lg bg-sky-600 px-4 py-2 text-xs font-medium text-white disabled:opacity-35" x-text="t('create')"></button></footer></section>
  </div>

  <!-- Authorized scope editor -->
  <div x-show="vulnerabilityShowScope" x-cloak x-transition.opacity @keydown.escape.window="vulnerabilityShowScope = false" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/45 p-4 backdrop-blur-sm">
    <section @click.outside="vulnerabilityShowScope = false" class="w-full max-w-2xl rounded-2xl border border-slate-200 bg-white shadow-2xl" role="dialog" aria-modal="true" :aria-label="t('vulnEditScopes')"><header class="flex items-start justify-between border-b border-slate-100 px-6 py-5"><div><h2 class="text-lg font-semibold text-slate-800" x-text="t('vulnEditScopes')"></h2><p class="mt-1 text-xs text-slate-400" x-text="t('vulnEditScopesHint')"></p></div><button @click="vulnerabilityShowScope = false" class="text-slate-400" :aria-label="t('close')">✕</button></header><div class="grid grid-cols-1 gap-5 px-6 py-5 md:grid-cols-2"><label class="block"><span class="text-xs font-medium text-slate-700" x-text="t('vulnIncludedScopes')"></span><textarea x-model="vulnerabilityScopeForm.included" rows="9" class="mt-2 w-full resize-none rounded-xl border border-slate-200 px-3 py-2.5 font-mono text-xs"></textarea></label><label class="block"><span class="text-xs font-medium text-slate-700" x-text="t('vulnExcludedScopes')"></span><textarea x-model="vulnerabilityScopeForm.excluded" rows="9" class="mt-2 w-full resize-none rounded-xl border border-rose-100 bg-rose-50/40 px-3 py-2.5 font-mono text-xs"></textarea></label></div><footer class="flex justify-end gap-2 border-t border-slate-100 bg-slate-50/70 px-6 py-4"><button @click="vulnerabilityShowScope = false" class="px-3 py-2 text-xs text-slate-500" x-text="t('cancel')"></button><button @click="vulnerabilitySaveScopes()" :disabled="!vulnerabilityScopeForm.included.trim() || vulnerabilitySubmitting" class="rounded-lg bg-sky-600 px-4 py-2 text-xs font-medium text-white disabled:opacity-35" x-text="t('save')"></button></footer></section>
  </div>

  <!-- Report preview -->
  <div x-show="vulnerabilityShowReport" x-cloak x-transition.opacity @keydown.escape.window="vulnerabilityShowReport = false" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/45 p-4 backdrop-blur-sm">
    <section @click.outside="vulnerabilityShowReport = false" class="flex max-h-[88vh] w-full max-w-4xl flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl" role="dialog" aria-modal="true" :aria-label="t('vulnReportPreview')"><header class="flex items-start justify-between border-b border-slate-100 px-6 py-5"><div><h2 class="text-lg font-semibold text-slate-800" x-text="vulnerabilitySelectedReport?.title"></h2><p class="mt-1 text-xs text-slate-400" x-text="vulnerabilitySelectedReport?.format"></p></div><button @click="vulnerabilityShowReport = false" class="text-slate-400" :aria-label="t('close')">✕</button></header><pre class="flex-1 overflow-auto whitespace-pre-wrap px-6 py-5 text-xs leading-relaxed text-slate-700" x-text="vulnerabilitySelectedReport?.content"></pre><footer class="flex justify-end gap-2 border-t border-slate-100 bg-slate-50/70 px-6 py-4"><button @click="vulnerabilityShowReport = false" class="px-3 py-2 text-xs text-slate-500" x-text="t('close')"></button><a x-show="vulnerabilitySelectedReport" :href="vulnerabilitySelectedReport ? vulnerabilityReportDownloadUrl(vulnerabilitySelectedReport) : '#'" class="rounded-lg bg-slate-900 px-4 py-2 text-xs font-medium text-white" x-text="t('vulnDownload')"></a></footer></section>
  </div>
</div>
</template>

<!-- ═══════════ GRAPH VIEW ═══════════ -->
<template x-if="view === 'graph'">
<div class="flex-1 flex flex-col overflow-hidden">
  <header class="bg-white/80 backdrop-blur border-b border-slate-200/60 px-4 py-2.5 flex items-center gap-3 shrink-0 z-20">

      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div class="title-action-trigger flex items-center gap-2 min-w-0">
      <span class="text-[11px] font-mono text-slate-400" x-text="project.project.id"></span>
      <h2 class="text-[15px] font-semibold text-slate-700 truncate" x-text="project.project.title"></h2>
      <button x-show="!replay.active" @click="openRenameProject(project.project.id, project.project.title)"
        class="title-action-button inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border border-slate-200 text-slate-400 hover:border-slate-300 hover:bg-slate-50 hover:text-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400"
        :title="t('renameProject')"
        :aria-label="`Rename ${project.project.title}`">
        <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="m16.862 4.487 1.65-1.65a1.875 1.875 0 1 1 2.652 2.652l-9.193 9.193a4.5 4.5 0 0 1-1.897 1.13L6 17l1.188-4.074a4.5 4.5 0 0 1 1.13-1.897l8.544-8.542Z"/><path d="M19.5 7.125 16.875 4.5"/><path d="M5.25 18.75h13.5"/></svg>
      </button>
      <span class="px-1.5 py-0.5 rounded-full text-[9px] font-semibold uppercase tracking-[0.12em] shrink-0"
        :class="projectStatusBadgeClass(project.project.status)"
        x-text="statusLabel(project.project.status)"></span>
    </div>
    <div class="flex-1"></div>
    <div class="flex items-center gap-4 text-xs text-slate-400">
      <span x-text="t('factsCount', {n: project.facts.length})"></span>
      <span x-text="t('intentsCount', {n: project.intents.length})"></span>
    </div>
    <div class="flex items-center gap-1.5">
      <template x-if="!replay.active">
        <button @click="startProjectReplay()" class="px-2.5 py-1 rounded-lg border border-violet-200 text-xs text-violet-600 hover:bg-violet-50 transition flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/><path d="M4 5v14"/></svg>
          <span x-text="t('replay')"></span>
        </button>
      </template>
      <template x-if="replay.active">
        <div class="flex items-center gap-1.5 rounded-xl border border-violet-200 bg-violet-50/80 px-2 py-1 text-xs text-violet-700">
          <span class="font-medium whitespace-nowrap" x-text="replayProgressLabel()"></span>
          <button @click="toggleProjectReplayPlayback()" class="inline-flex h-6 w-6 items-center justify-center rounded-md border border-violet-200 bg-white/80 hover:bg-white transition" :title="replay.playing ? t('pauseReplay') : t('resumeReplay')">
            <svg x-show="replay.playing" class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 6h3v12H8zM13 6h3v12h-3z"/></svg>
            <svg x-show="!replay.playing" class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></svg>
          </button>
          <button @click="restartProjectReplay()" class="inline-flex h-6 w-6 items-center justify-center rounded-md border border-violet-200 bg-white/80 hover:bg-white transition" :title="t('restartReplay')">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.708"/><path d="M3 3v6h6"/></svg>
          </button>
          <select x-model="replay.stepMs" @change="updateReplaySpeed()" class="h-6 rounded-md border border-violet-200 bg-white/80 px-1.5 text-[11px] text-violet-700 focus:outline-none focus:ring-2 focus:ring-violet-100">
            <option value="700" x-text="t('fast')">Fast</option>
            <option value="1100" x-text="t('normal')">Normal</option>
